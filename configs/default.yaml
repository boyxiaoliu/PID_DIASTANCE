# =============================================================================
# PID控距 —— 默认配置
# =============================================================================
# 规则（AGENTS.md §4）：
#   - 所有可调参数集中在此，代码零硬编码；魔法数字必须带 # TODO(calib) 与来源
#   - 分节认领：perception/target 归线A，control/camera 归线B，data 两线共用
#   - 改参数必须在 experiments/ 留痕
# =============================================================================

meta:
  version: "0.3.0"
  updated: "2026-10-24"
  note: "S5 前置版：新增收敛终验（confirm_attempts）与 4K 确认照（final_shot + camera.still/quality）；闭环步长参数不变"

# -----------------------------------------------------------------------------
# 感知层 〔线A 认领〕
# -----------------------------------------------------------------------------
perception:
  spine:
    # ---- 书本最低点（书脊 OBB 框底边）----
    min_confidence: 0.50     # TODO(G1) 置信度门槛，先用学长系统默认 0.5
    max_boxes: 20            # 参与统计的框数上限，防单帧海量误检拉偏底边
    offline_json_root: "D:/Claude/01_图书馆项目/图书馆数据8_7/02_检测JSON"
                             # 离线阶段书本最低点来源（真机换 RKNN，同一契约）

  bar:
    # ---- 横杆检测：全宽逐列扫描 + 稳健直线拟合（S1 规划定稿，cv2.fitLine M-estimator）----
    # 画面整体 roll 或斜视 yaw 都会把横杆从水平线变成斜线；与其分别估计角度再"摆正"，
    # 不如对边点云直接稳健拟合：中心截距 = 控制信号，斜率 = 体检指标，内点率 = 体检指标。
    highpass_sigma: 201      # 高通核长（行像素），201 对应 4K 图约 9% 画高（旧项目实测值）
    spine_margin_frac: 0.010 # 横杆搜索区上界 = 书本最低点y/H + 此余量（防书脊框压住横杆边）
    fallback_zone_frac: 0.85 # 书脊缺失时的兜底搜索区 = [0.85H, H]（旧项目 bot_zone 量级）
    min_contrast: 4.0        # 峰显著性的绝对灰度差门限（旧项目实测值）
    rel_threshold: 0.40      # 峰显著性相对门限（旧项目扫描后抖动最小的取值）
    scan_win_frac: 0.07      # 扫描窗口宽（相对画面宽），窗口内行均值成 1D 剖面再取峰
    scan_step_frac: 0.035    # 扫描步进（相对画面宽），相邻窗口重叠一半
    pick: bottommost         # 每窗口取峰策略：位置优先（旧项目踩坑结论），备选 topmost/strongest
    min_points: 8            # 直线拟合最少点数，少于此判该帧未检出
    inlier_tol_px: 12.0      # 拟合内点残差容差（4K 像素），TODO(G1) 按实测残差 std 复核
    fit: ransac              # 直线拟合：ransac=锁支持度最大的边（S1真图实验升级，默认）
                             # huber=M-estimator（会被少数派边拉偏，仅对照用）

# -----------------------------------------------------------------------------
# 数据体检阈值 〔线A 认领，S1 工具用，G1 后复核〕
# -----------------------------------------------------------------------------
health:
  roll_max_deg: 3.0        # 中位书脊倾角超过此值判"旋转歪"剔除（S1 实测分布：仅6/247超）
  min_inlier_ratio: 0.70   # 横杆直线拟合内点率低于此判"结构乱"剔除
  slope_abs_max_deg: 6.0   # 横杆斜率绝对值超过此值判"斜得离谱"剔除（初值，待分布验证）
  gap_min_frac: 0.015      # 黄线(横杆下沿)与蓝线(书底)的最小间距。更小 = 下沿出画、
                           # 程序锁到了上沿（G1 用户目检发现，S1 数据 15/168 张，
                           # 两群间隙在 0.010~0.058 之间取 0.015）。
                           # ⚠️ 闭环安全规则：此状态 = 太近，控制器只许后退（见 S3 设计）。

# -----------------------------------------------------------------------------
# 目标状态 〔线A 认领，G1 标定后回填〕
# -----------------------------------------------------------------------------
target:
  bar_y_frac: 0.955          # G1 正式定稿（2026-10-18 用户确认）：干净有效读数中位数，
                             # 合格带 0.925~0.985；人工标注验收 140/150 张读数获认可(93.3%)
  bar_y_frac_tol: 0.030      # 容差带半宽 —— 覆盖 P25~P75 的 0.940~0.973，对应 ±10cm

# -----------------------------------------------------------------------------
# 控制层 〔线B 认领〕
# -----------------------------------------------------------------------------
control:
  pid:
    # !! 增益为按新误差信号增益的量纲推导初值，未经仿真/真机标定 —— TODO(S3)
    # 误差单位：比例域（bar_y_frac 之差）；输出单位：米，正 = 后退
    # 量纲推导：bar_frac(d) ≈ A + B/d，d≈1.5m 处 ∂bar_frac/∂d ≈ -0.27/m
    #          （B≈0.615 假设 target=0.91 对应 d=1.5）→ kp 取其倒数 ≈ 3.7
    kp: 3.70
    ki: 0.30
    kd: 0.20
    out_limit: 0.20          # 近距单步限幅（米），真机安全优先，比旧项目更保守 —— TODO(S3)
    i_limit: 0.15            # 积分限幅，抗饱和
    deadband: 0.004          # 死区（比例域），约合 4K 下 8.6px
    d_alpha: 0.20            # 微分低通系数
    dt_default: 0.5          # 默认采样周期（秒）；真机上按实测重定 —— TODO(S4)
    out_limit_far: 0.50      # 增益调度：|err| 大时的放宽限幅 —— TODO(S3)
    far_threshold: 0.15      # 增益调度切换阈值 —— TODO(S3)

  loop:
    max_iters: 40            # 单点最大迭代轮数。20→40：步长改小（backoff 0.05/sat 0.03）
                             # 后深起点逃生轮数翻倍（d*=1.8 档 0.9m 起点约需 18~25 轮），
                             # 20 不够用。代价 = 单点最坏真机 200s（5s/轮）—— S4 调整，S5 复核
    hold_frames: 3           # 连续 N 轮（中值滤波后）在容差带内才判收敛
    backoff_m: 0.05          # 丢失（黄蓝全无）时固定后退步长。0.20→0.05（用户意见
                             # "多次少量"，小步盲退更稳；原值 S3/旧项目同款）
    max_backoff: 15          # 连续丢失 N 轮后放弃（饱和态不计入）。5→15 与步长缩小
                             # 连动：d*=1.8 档丢失区最宽 0.53m（0.9→1.43m 全看不见），
                             # 0.05×15=0.75m 覆盖+噪声余量（第一版 12 不够：仿真实测
                             # 93 例 lost 放弃，见 2026-10-21 步长调整实验）
    sat_step_m: 0.03         # 饱和态固定后退步长。0.10→0.03（用户意见"多次少量"）：
                             # 饱和带仅 0.03~0.05m 宽（d*=1.2/1.5/1.8 三档），
                             # 0.03 最多多走一轮，换来更细的贴近；注意
                             # sim.move_std=0.02 的停稳噪声会吃掉部分步长
    # ---- 近距离前进限幅（安全装置，S3 冒烟驱动的补丁）----
    # 读数 ≥ target − close_band 时，前进（负）指令分级限幅。
    # 防的目标：噪声读数诱发的大步前进一步跨过 d*−0.15m 安全线。
    # 推导（读数→距离换算 dd = d²/B·dr）：越线环 = 线上方 一次限幅步+3σ停稳
    # 噪声(0.06m) 能触到的区间；要求环内真读数与门槛差 ≥4σ读数
    # → close_band=0.11 对 d*=1.2/1.5/1.8 三档均覆盖。
    # 带内分两级：|err| ≥ fwd_cap_err(=2×tol) 时放宽到 fwd_limit_far_zone ——
    #   该档步从最不利点(d*+0.33m)出发落点距安全线仍有 ≥12cm 裕度（三档验算），
    #   否则限幅带在远 d* 档伸到 2.4m、0.05m 爬行耗光迭代预算（S3 实测 90.5%）。
    fwd_limit: 0.05            # 深档（|err| < fwd_cap_err，贴近目标时）
    fwd_limit_far_zone: 0.15   # 宽档（限幅带内但还差得远时）
    fwd_cap_err: 0.06          # 两档切换阈值（=2×tol）
    close_band: 0.11
    confirm_attempts: 3        # 收敛终验次数上限（S5 新增）：收敛判据是 3 点中值，
                               # 最新帧可能已出带而中值仍在带内（项目记忆 S5 注意点）；
                               # 终验 = 收敛后重新取帧单帧直判，出带就回到闭环再调，
                               # 连续 N 次终验不过才如实报"未到位"

  saturation:                # 饱和标度规则（S1 实验 README 标度表，S3 落实）
    spine_frac_sat: 0.95     # 蓝线(书底)≥此值且黄线未检出 → 判"太近"饱和
    sat_reading: 1.0         # 饱和态读数固定值（画面最下沿）
    # gap_min_frac 复用 health.gap_min_frac（同一阈值单一来源，两处不得分叉）

  mover:                     # 底盘移动原语（S4 新增；Athena 2.0 只有绝对坐标动作、无速度控制，
                             # 相对位移 = get_pose 现算绝对目标，见 src/pid_servo/robot/mover.py）
    chassis_url: "http://10.230.152.204:1448"
                             # TODO(calib) 与学长系统 pipeline.yaml 的 chassis_url 同源，实机按现场改
    action_timeout_s: 60.0   # 单次动作等待上限；超时先补急停再报错（安全优先）
    poll_interval_s: 0.2     # 动作状态轮询间隔
    request_timeout_s: 5.0   # 单个 HTTP 请求超时（学长系统同值）
    position_tol_m: 0.10     # 完成后位姿复核容差（学长系统 check_position 同值）
    max_recheck: 1           # 位姿复核不达标时的重发次数上限
    invert_dir: false        # TODO(S5) 首跑核对方向符号：true = u 正值改为沿机头方向
    settle_ms: 800           # 移动完成后等停稳+曝光稳定（自 saturation 节移入）—— TODO(S4) 真机实测重定

  spine_detector:            # 板端书脊检测部署件（S4 新增；算法阈值沿用 perception.spine，单一来源）
    model_path: ""           # TODO(S4上板) 学长 all_models/yolo11n_obb_model/yolo11n_obb_1024_1_3-rk3588.rknn
                             #   的板端绝对路径；留空 = 真机模式装配时直接报错
    input_size: 1024         # 与学长部署一致（robot/spine_detector.py letterbox 同值）
    class_id: 0              # 0 = book 书脊（学长 metadata 同源）

  final_shot:                # 确认照（S5 新增）：终验到位后按学长标准拍的高清存档，
                             # 是闭环的验收证据；下游正式盘点由学长系统负责，本工具到此为止
    enabled: true            # false = 只做终验不拍确认照

# -----------------------------------------------------------------------------
# 相机 / 采集 〔线B 认领，真机阶段启用〕
# -----------------------------------------------------------------------------
camera:
  cam_id: "4"                # 本阶段闭环只用 cam_4（一层一机，USB 带宽只开一路）
  preview_height: 540        # 闭环用缩放帧（误差是比例域，与分辨率无关），终版才拍 4K
  preview_width: 960         # 540p 预览的配对宽度（16:9）
  fourcc: "MJPG"             # USB 带宽所需（学长 camera_config.yaml 同值）
  fps: 30                    # 采集帧率（学长同值）
  device_path: ""            # TODO(S4上板) /dev/v4l/by-path/... （学长 camera_config.yaml cam_4 同源，
                             #   插拔不串号）；留空 = 退回用 cam_id 当 /dev/videoN 索引
  settle_frames: 3           # 开流后丢弃前 N 帧（曝光未稳）
  still_width: 3840          # 确认照（终拍）分辨率：终拍回 4K（学长 capture_group 同值）—— TODO(S4上板) 首拍核对
  still_height: 2160
  quality:                   # 确认照质检两道门 + 重拍节奏（阈值与学长 Camera.check_frame_quality 同源）
    blur_min_lap: 100        # 灰度图 Laplacian 方差下限，低于 = 模糊
    brightness_min: 40       # 亮度均值合格下界
    brightness_max: 220      # 亮度均值合格上界
    retries: 3               # 质检不达标重拍次数上限（含首拍）
    retry_wait_ms: 1000      # 相邻两次重拍的间隔（学长同值）
  light:                     # 补光灯（学长 led.py 的 Modbus RTU 帧，Y1 继电器，闭环全程常亮）
    enabled: false           # TODO(S4上板) 现场核对继电器通道对应补光灯后启用
    port: "/dev/ttyCH341USB0"
    baudrate: 38400

# -----------------------------------------------------------------------------
# S3 闭环仿真模型 〔本次 fork 会话认领（线B 侧），真机阶段即废弃〕
# -----------------------------------------------------------------------------
sim:
  A: 0.50                    # 读数模型 bar_frac=A+B/d 的远端渐近值（地平线假设，S3 设计定稿）
                             # TODO(calib) 如真机远拍数据可测，复核此值
  gap0_frac: 0.058           # d* 处黄蓝间距（S1 干净群中位）TODO(calib)
  noise_std: 0.0299          # σ0 黄线读数噪声基准（旧项目同货架实测），压力档按倍率加压
  gap_noise_std: 0.005       # 黄蓝间距的测量噪声，不随压力档加压 —— 依据：S1 真数据
                             # 间距呈双峰、0.015 处干净可分，间距噪声必远小于读数噪声
                             # TODO(calib) 用 S1 幸存样本的组内 spread 复核
  dropout: 0.024             # 整帧坏帧率（真数据 6/247）
  move_std: 0.02             # 底盘停稳散布 σ（假设值）TODO(S5) 真机实测重定
  bar_out_frac: 1.0          # 下沿出画阈值：真读数超过它 = 黄线不可见（像素不能出画面，结构性）
  topedge_offset: 0.008      # 黄蓝重合态：锁到横杆上沿时黄线相对蓝线的偏移，
                             # < gap_min_frac 保证触发饱和规则（假设值）TODO(calib)
  topedge_std: 0.003         # 上沿锁定抖动 σ
  img_h: 2160                # 仿真画面尺寸（4K，与 cam_4 一致）
  img_w: 3840
  d_floor: 0.25              # 仿真距离下限（米，旧项目同值，防数值发散）
  d0_list: [0.9, 1.2, 1.5, 2.0, 2.5, 3.0, 3.4]   # 考试初始距离档（S3 设计定稿）
  noise_mults: [1, 2, 3]                          # 噪声压力档（σ0 的倍数）
  d_star_list: [1.2, 1.5, 1.8]                    # 真实完美距离档（d* 不确定性）
  seeds: 200                 # 每格种子数（固定种子可复现）
  sec_per_iter: 5            # 真机每轮（移动+停稳+拍照）估时（秒）
  safety_margin_m: 0.15      # 安全线：全程 d ≥ d* − 此值（S3 设计定稿）

# -----------------------------------------------------------------------------
# 数据源（外部只读，两线共用，不入库）
# -----------------------------------------------------------------------------
data:
  dataset8_7: "D:/Claude/01_图书馆项目/图书馆数据8_7"
  ori_img_save: "D:/Library_Project/ori_img_save"
  label_classes: {spine: 15, shelf_top: 16, shelf_bot: 18, rack_label: 19}
