# =============================================================================
# PID控距 —— 默认配置
# =============================================================================
# 规则（AGENTS.md §4）：
#   - 所有可调参数集中在此，代码零硬编码；魔法数字必须带 # TODO(calib) 与来源
#   - 分节认领：perception/target 归线A，control/camera 归线B，data 两线共用
#   - 改参数必须在 experiments/ 留痕
# =============================================================================

meta:
  version: "0.1.0"
  updated: "2026-10-14"
  note: "S0 骨架版。target 为占位值待 G1 标定；PID 增益待 S3 仿真重推"

# -----------------------------------------------------------------------------
# 感知层 〔线A 认领〕
# -----------------------------------------------------------------------------
perception:
  spine:
    # ---- 书本最低点（书脊 OBB 框底边）----
    min_confidence: 0.50     # TODO(G1) 置信度门槛，先用学长系统默认 0.5
    max_boxes: 20            # 参与统计的框数上限，防单帧海量误检拉偏底边
    offline_json_root: "D:/Claude/01_图书馆项目/图书馆数据8_7/02_检测JSON"
                             # 离线阶段书本最低点来源（真机换 RKNN，同一契约）

  bar:
    # ---- 横杆检测：全宽逐列扫描 + 稳健直线拟合（S1 规划定稿，cv2.fitLine M-estimator）----
    # 画面整体 roll 或斜视 yaw 都会把横杆从水平线变成斜线；与其分别估计角度再"摆正"，
    # 不如对边点云直接稳健拟合：中心截距 = 控制信号，斜率 = 体检指标，内点率 = 体检指标。
    highpass_sigma: 201      # 高通核长（行像素），201 对应 4K 图约 9% 画高（旧项目实测值）
    spine_margin_frac: 0.010 # 横杆搜索区上界 = 书本最低点y/H + 此余量（防书脊框压住横杆边）
    fallback_zone_frac: 0.85 # 书脊缺失时的兜底搜索区 = [0.85H, H]（旧项目 bot_zone 量级）
    min_contrast: 4.0        # 峰显著性的绝对灰度差门限（旧项目实测值）
    rel_threshold: 0.40      # 峰显著性相对门限（旧项目扫描后抖动最小的取值）
    scan_win_frac: 0.07      # 扫描窗口宽（相对画面宽），窗口内行均值成 1D 剖面再取峰
    scan_step_frac: 0.035    # 扫描步进（相对画面宽），相邻窗口重叠一半
    pick: bottommost         # 每窗口取峰策略：位置优先（旧项目踩坑结论），备选 topmost/strongest
    min_points: 8            # 直线拟合最少点数，少于此判该帧未检出
    inlier_tol_px: 12.0      # 拟合内点残差容差（4K 像素），TODO(G1) 按实测残差 std 复核
    fit: ransac              # 直线拟合：ransac=锁支持度最大的边（S1真图实验升级，默认）
                             # huber=M-estimator（会被少数派边拉偏，仅对照用）

# -----------------------------------------------------------------------------
# 数据体检阈值 〔线A 认领，S1 工具用，G1 后复核〕
# -----------------------------------------------------------------------------
health:
  roll_max_deg: 3.0        # 中位书脊倾角超过此值判"旋转歪"剔除（S1 实测分布：仅6/247超）
  min_inlier_ratio: 0.70   # 横杆直线拟合内点率低于此判"结构乱"剔除
  slope_abs_max_deg: 6.0   # 横杆斜率绝对值超过此值判"斜得离谱"剔除（初值，待分布验证）
  gap_min_frac: 0.015      # 黄线(横杆下沿)与蓝线(书底)的最小间距。更小 = 下沿出画、
                           # 程序锁到了上沿（G1 用户目检发现，S1 数据 15/168 张，
                           # 两群间隙在 0.010~0.058 之间取 0.015）。
                           # ⚠️ 闭环安全规则：此状态 = 太近，控制器只许后退（见 S3 设计）。

# -----------------------------------------------------------------------------
# 目标状态 〔线A 认领，G1 标定后回填〕
# -----------------------------------------------------------------------------
target:
  bar_y_frac: 0.910          # TODO(G1) 占位值 —— 标定方法：完美样本上检测量的中位数
  bar_y_frac_tol: 0.040      # TODO(G1) 容差带半宽 —— 依据 S1 分布的抖动 std 取 ~1.7σ

# -----------------------------------------------------------------------------
# 控制层 〔线B 认领〕
# -----------------------------------------------------------------------------
control:
  pid:
    # !! 增益为按新误差信号增益的量纲推导初值，未经仿真/真机标定 —— TODO(S3)
    # 误差单位：比例域（bar_y_frac 之差）；输出单位：米，正 = 后退
    # 量纲推导：bar_frac(d) ≈ A + B/d，d≈1.5m 处 ∂bar_frac/∂d ≈ -0.27/m
    #          （B≈0.615 假设 target=0.91 对应 d=1.5）→ kp 取其倒数 ≈ 3.7
    kp: 3.70
    ki: 0.30
    kd: 0.20
    out_limit: 0.20          # 近距单步限幅（米），真机安全优先，比旧项目更保守 —— TODO(S3)
    i_limit: 0.15            # 积分限幅，抗饱和
    deadband: 0.004          # 死区（比例域），约合 4K 下 8.6px
    d_alpha: 0.20            # 微分低通系数
    dt_default: 0.5          # 默认采样周期（秒）；真机上按实测重定 —— TODO(S4)
    out_limit_far: 0.50      # 增益调度：|err| 大时的放宽限幅 —— TODO(S3)
    far_threshold: 0.15      # 增益调度切换阈值 —— TODO(S3)

  loop:
    max_iters: 12            # 单点最大迭代轮数
    hold_frames: 3           # 连续 N 轮（中值滤波后）在容差带内才判收敛
    backoff_m: 0.20          # 观测丢失（太近）时固定后退步长
    max_backoff: 3           # 连续退化 N 轮后放弃
    settle_ms: 800           # 移动后等底盘停稳+曝光稳定 —— TODO(S4) 真机实测重定

# -----------------------------------------------------------------------------
# 相机 / 采集 〔线B 认领，真机阶段启用〕
# -----------------------------------------------------------------------------
camera:
  cam_id: "4"                # 本阶段闭环只用 cam_4（一层一机，USB 带宽只开一路）
  preview_height: 540        # 闭环用缩放帧（误差是比例域，与分辨率无关），终版才拍 4K
  settle_frames: 3           # 开流后丢弃前 N 帧（曝光未稳）

# -----------------------------------------------------------------------------
# 数据源（外部只读，两线共用，不入库）
# -----------------------------------------------------------------------------
data:
  dataset8_7: "D:/Claude/01_图书馆项目/图书馆数据8_7"
  ori_img_save: "D:/Library_Project/ori_img_save"
  label_classes: {spine: 15, shelf_top: 16, shelf_bot: 18, rack_label: 19}
